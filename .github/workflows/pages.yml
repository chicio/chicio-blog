name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'packages/matrix-design-system/**'
      - 'apps/matrix-design-system-showcase/**'
      - '.github/pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build the showcase
        run: npx turbo run build --filter=matrix-design-system-showcase
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp .github/pages/index.html .github/pages/logo.png _site/
          cp -r apps/matrix-design-system-showcase/dist _site/design-system
          echo "assembled:" && find _site -maxdepth 2 -name index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
