name: Dependabot auto-merge

# Arms GitHub's native auto-merge on Dependabot pull requests. It does not merge anything itself:
# it tells GitHub to merge the PR once every required status check passes, and GitHub remains the
# thing enforcing that. Nothing here re-implements merge gating, which is why the ruleset on `main`
# is load-bearing rather than belt-and-braces.
#
# Deliberately NOT gated on the Vercel preview. `E2E (Playwright)` already builds and drives the
# real production site, so requiring the preview on top would be redundant — and a required check
# that Vercel may never post (its `ignoreCommand` skips builds for commits that cannot affect the
# site) would block a PR forever. The consequence is worth stating plainly: Vercel's state does not
# block a Dependabot merge.

on: pull_request

# Workflows triggered by Dependabot get a read-only token by default; declaring these explicitly is
# what grants the write access `gh pr merge` needs. Scoped to this workflow, not the repository.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Arm auto-merge
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      # Without a required status check on `main`, `gh pr merge --auto` does not wait for anything —
      # it merges immediately, on every Dependabot PR, red or green. That is the single worst
      # outcome available here, so refuse rather than risk it. Rules in `evaluate` mode enforce
      # nothing and correctly do not appear, which keeps auto-merge inert until the ruleset is
      # actually enforcing.
      - name: Refuse to arm auto-merge without a required status check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          checks=$(gh api "repos/$GITHUB_REPOSITORY/rules/branches/main" \
            --jq '[.[] | select(.type == "required_status_checks")
                   | .parameters.required_status_checks[].context] | join(",")')
          if [ -z "$checks" ]; then
            echo "::error::Branch main enforces no required status checks, so auto-merge would merge immediately. Refusing."
            exit 1
          fi
          echo "Required status checks on main: $checks"

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2

      # `update-type` is the HIGHEST semver change in the PR, so a group containing a major reports
      # major and is left alone. Majors are where green CI is a weak signal: mermaid 11 -> 12 renders
      # the diagrams in the MDX content, and a rendering change passes lint, typecheck, tests and
      # Playwright while shipping a visible regression. Nothing in the suite asserts that a diagram
      # still looks right, so a human does.
      #
      # An unexpected or empty `update-type` fails this condition and simply does not arm auto-merge,
      # which is the safe direction.
      - name: Arm auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
