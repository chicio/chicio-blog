# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  - package-ecosystem: "npm"
    # One entry, and it has to stay one entry. The root declares `workspaces: ["apps/*",
    # "packages/*"]`, so the `/` job already discovers every workspace manifest by itself — listing
    # those globs again here spawns a separate update job per directory, and they all rewrite the
    # single root package-lock.json. Whichever job writes last wins, the lockfile stops agreeing
    # with the manifests, and every check dies in `npm ci` before it runs. That is what happened to
    # #566 and #574; #563 was the same bump as #562 raised twice and closed as redundant.
    directories:
      - "/"
    # Daily rather than weekly. The weekly run dumped everything outstanding into one Sunday batch:
    # 15 open PRs, and because every branch push builds, 20 Vercel deployments in ten minutes. Daily
    # does not reduce the total volume, it spreads it — the two settings that actually cut volume are
    # `rebase-strategy` below and the `others` group. Time and timezone are pinned so the batch lands
    # at the start of the day here rather than at Dependabot's ~05:00 UTC default.
    schedule:
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Rome"

    # Dependabot rebases every open PR whenever main moves. With twenty PRs open, one merge becomes
    # twenty force-pushes, each firing a full CI run and a Vercel preview build — that is where the
    # bulk of those cancelled deployments came from. Disabled, PRs go stale instead: they stay
    # mergeable unless the lockfile genuinely conflicts, and `@dependabot rebase` fixes the ones that
    # do. This is the single largest reduction in this file, larger than the cadence change above.
    rebase-strategy: "disabled"
    assignees:
      - "chicio"
    commit-message:
      prefix: "chore(deps): :arrow_up: "
    # Five manifests share 34 packages, so an ungrouped bump of react or typescript arrives as four
    # or five PRs that are only correct if they all land. Raised together, CI validates them as the
    # unit they actually are.
    #
    # Twenty rather than the default 5. Under a daily schedule this is a ceiling, not a target: the
    # `others` group collapses the long tail, so an ordinary day raises one to three PRs and the
    # limit is never approached. It matters on the days it is — a PR that cannot merge holds its slot
    # until someone closes it, and at ten, two stuck PRs were enough to starve typegpu for a month.
    # zod is exactly such a PR today (see the `others` group), so the headroom is not hypothetical.
    open-pull-requests-limit: 20
    groups:
      react:
        # The root pins @types/react and @types/react-dom in `overrides`, so a types bump that is not
        # applied everywhere at once resolves to two copies and breaks the typecheck.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-icons"
          - "babel-plugin-react-compiler"
      ai-sdk:
        # @ai-sdk/react exact-pins `ai`. Bumping one alone duplicates the package and fails the
        # typecheck — this cluster has to move as a whole.
        patterns:
          - "ai"
          - "@ai-sdk/*"
      next:
        patterns:
          - "next"
          - "@next/*"
          - "eslint-config-next"
      design-system-peers:
        # Declared by the design system as peer dependencies AND by the apps that install them. A
        # bump landing in one place leaves the declared range disagreeing with what is installed —
        # and for framer-motion a second copy breaks AnimatePresence across the package boundary.
        patterns:
          - "unified"
          - "remark-*"
          - "rehype-*"
          - "react-markdown"
          - "cmdk"
          - "recharts"
          - "framer-motion"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "tsdown"
          - "tsx"
      lint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "dependency-cruiser"
          - "knip"
        exclude-patterns:
          # A workspace package, not a registry one.
          - "eslint-plugin-chicio"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
          - "@playwright/*"
          - "playwright"
          - "@vitejs/plugin-react"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
      upstash:
        patterns:
          - "@upstash/*"
      typegpu:
        # The satellites peer-depend on the core by exact minor: @typegpu/react@0.11.2 peers
        # typegpu ^0.11.9, and unplugin-typegpu@0.12.3 peers ^0.12.4. Moving one without the
        # others lands a peer range nothing can satisfy.
        patterns:
          - "typegpu"
          - "@typegpu/*"
          - "unplugin-typegpu"
          - "@webgpu/types"
      serwist:
        # @serwist/next peers on serwist itself and the three ship in lockstep. They are already
        # drifting — @serwist/build sits at both 9.5.11 and 9.5.12 in the lockfile today.
        patterns:
          - "serwist"
          - "@serwist/*"
      oxc:
        # Not a peer contract — oxlint and oxfmt are on independent version lines. Grouped because
        # they are one toolchain in one workspace, so a week that moves both is one review, not two.
        patterns:
          - "oxlint"
          - "oxfmt"
          - "oxc-*"
          - "@oxc-project/*"
      release:
        # release-it and its changelog plugin move as a pair: plugin 11 accepts release-it
        # ^18 || ^19 || ^20, plugin 12 adds ^21. A bump landing one without the other leaves a peer
        # range nothing satisfies.
        patterns:
          - "release-it"
          - "@release-it/conventional-changelog"
      # Everything else, as one PR a day instead of eight. Unlike every group above, this one exists
      # for volume rather than correctness: zod, katex, @types/node, react-is, agent-browser and vite
      # have nothing to do with each other, they are simply the long tail that made the Sunday batch
      # look like twenty separate reviews.
      #
      # It MUST stay last. A dependency joins the first group whose patterns it matches, so a catch-all
      # placed any higher would swallow the correctness groups above and silently undo every
      # peer-pinning guarantee they exist to enforce.
      #
      # Majors are deliberately excluded and keep arriving as individual PRs. They are the updates
      # most likely to need a human: mermaid 11 -> 12 renders the diagrams in the MDX content, and a
      # rendering change passes lint, typecheck, tests and Playwright while shipping a visible
      # regression. Nothing here asserts that a diagram still looks right.
      others:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          # zod 4.6 breaks @modelcontextprotocol/sdk's compatibility shim: it declares
          # `AnySchema = z3.ZodTypeAny | z4.$ZodType`, and a 4.6 schema matches neither arm, so every
          # registerTool call in src/lib/mcp/tools/ fails to typecheck. SDK 1.30.0 is already the
          # latest and its peer range (^3.25 || ^4.0) still accepts the broken version, so there is
          # nothing to bump to and nothing to fix on our side short of casting the mismatch away.
          # Excluded rather than ignored, deliberately: zod keeps getting its own PR, which sits red
          # until the SDK types against zod 4 properly and then merges on its own. Left inside the
          # group it would make every other package in the group permanently unmergeable.
          - "zod"
    ignore:
      # Workspace packages. npm resolves these to the local copy whatever the range says, so a bump
      # PR changes a number that nothing reads.
      - dependency-name: "matrix-design-system"
      - dependency-name: "matrix-component-store"
      - dependency-name: "eslint-plugin-chicio"
      - dependency-name: "matrix-rain-webgpu"
      # Root `typescript` is pinned to major 6 (typescript-eslint needs its compiler API; TS 7 ships
      # none) while every workspace's own `typescript` is major 7 (the faster type checker, no
      # compiler API needed there). `ignore` has no per-manifest or per-directory scope, only
      # ecosystem-wide, so this blocks BOTH majors moving together: root 6.x -> 7.x and workspaces
      # 7.x -> 8.x. A second directory-scoped `updates:` entry is not an option here for the same
      # shared-lockfile reason recorded above (#566, #574); what was actually tried and reverted in
      # #582 was adding those directory globs to THIS entry's `directories:` list, which spawns one
      # job per directory instead. Aliasing root to `npm:@typescript/typescript6` was also tried: npm
      # collapses the alias onto real `typescript@6.x` because many root packages peer-depend on
      # `typescript`, so the manifest would disagree with the installed tree. Minor bumps are not
      # blocked by this ignore rule. What actually matters, root never reaching major 7, is already
      # enforced elsewhere and hard: typescript-eslint throws at import once the compiler's major is
      # >= 7, failing the lint job outright (how PR #620 failed) — this ignore is belt-and-braces on
      # top of that, not the only guard. A root 6.1 minor is caught by nothing here: `legacy-peer-deps
      # = true` (root `.npmrc`) skips peer-range enforcement at install, so typescript-eslint@8.69's
      # `typescript` peer of `>=4.8.4 <6.1.0` is never checked, and typescript-eslint only warns while
      # the major stays 6. It would most likely just work, but it is outside typescript-eslint's
      # tested range and unverified here. Patch bumps on both majors flow through normally. Revisit
      # once typescript-eslint supports TS 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
